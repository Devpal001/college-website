<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Apply the saved theme before first paint so dark mode (and the
      // flattened shadow tokens) never flash the wrong values.
      // The palette itself lives in src/index.css (:root + html.dark) —
      // this script only toggles the `dark` class.
      (function () {
        try {
          var saved = localStorage.getItem('mbscet-theme');
          var dark = saved
            ? saved === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {
          /* localStorage unavailable — light theme applies */
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="MBSCET Jammu — Mahant Bachittar Singh College of Engineering & Technology. Admissions, departments, news, and the student academic portal."
    />
    <meta name="theme-color" content="#353084" />
    <title>MBSCET Jammu | Digital Platform</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
