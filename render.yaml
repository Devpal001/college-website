# ============================================
# Render Blueprint — MBSCET Express API (server/)
# ============================================
# Deploy: Render Dashboard → New + → Blueprint → select this repo.
# Render reads this file and prompts you for the values marked `sync: false`
# (your Supabase URL + service-role key — copy them from college-website/.env).
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: mbscet-api
    runtime: node
    plan: free
    # The API is its own npm package (server/package.json) — express/cors are
    # NOT dependencies of the frontend package, so build inside server/.
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    # Render waits for this before marking the deploy live.
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Required — the server exits if these are missing (server/index.js).
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Admin portal-ID mapping for the demo login (ID=email).
      - key: DEMO_ADMIN_IDS
        value: "ADMIN001=demo-admin@mbscet.demo"
      # Keep the ID-only portal login enabled (this is the demo sign-in).
      - key: DISABLE_DEMO_LOGIN
        value: "false"
      # Optional — omit to use the built-in keyword classifier for the AI
      # assistant / news agent. Add it later in the Render dashboard if needed.
