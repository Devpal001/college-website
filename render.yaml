# ============================================
# Render Blueprint — MBSCET Express API (server/)
# ============================================
# Deploy: Render Dashboard → New + → Blueprint → select this repo.
# Render reads this file and prompts you for the values marked `sync: false`
# (your Supabase URL + service-role key — copy them from college-website/.env).
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: mbscet-api
    runtime: node
    plan: free
    # Commands run from the REPO ROOT. The API is its own npm package
    # (server/package.json — express/cors are NOT dependencies of the
    # frontend package, and server/node_modules is gitignored), so the
    # build installs BOTH dependency sets and start runs the committed
    # entry point directly. Validated locally end-to-end: server boots,
    # /health returns 200, STU001 demo-login returns 200 + session.
    buildCommand: npm install && npm install --prefix server
    startCommand: node server/index.js
    # Render waits for this before marking the deploy live.
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Required — the server exits if these are missing (server/index.js).
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Admin portal-ID mapping for the demo login (ID=email). Only consulted
      # when demo login is explicitly enabled (dev/testing).
      - key: DEMO_ADMIN_IDS
        value: "ADMIN001=demo-admin@mbscet.demo"
      # Production authentication is email/password (Supabase GoTrue). The
      # ID-only demo login MUST be OFF here — DISABLE_DEMO_LOGIN=true is an
      # explicit kill switch AND the code is fail-closed (demo is disabled in
      # production unless DEMO_LOGIN_ENABLED=true is ALSO set).
      - key: DISABLE_DEMO_LOGIN
        value: "true"
      # Ensures the server treats this as production (demo fail-closed default,
      # generic 500 messages, etc.). Render also sets this by default; explicit
      # is safer.
      - key: NODE_ENV
        value: "production"
      # Explicit CORS allow-list for browser origins (the code also defaults
      # to localhost dev ports + this production Vercel domain).
      - key: CORS_ORIGINS
        value: "https://college-website-psi-seven.vercel.app"
      # Optional — omit to use the built-in keyword classifier for the AI
      # assistant / news agent. Add it later in the Render dashboard if needed.
